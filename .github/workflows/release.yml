name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify version and generate changelog
        shell: bash
        run: |
          version="$(grep -E '^(const|var) Version =' version.go | cut -d'"' -f2)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

          if grep -Fq "## [v$version]" CHANGELOG.md; then
            awk -v ver="## [v$version]" '
              index($0, ver) { flag = 1; next }
              flag && /^## / { flag = 0; exit }
              flag { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          else
            prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            range="${prev_tag:+${prev_tag}..}${GITHUB_REF_NAME}"
            release_date="$(date -u +%Y-%m-%d)"

            {
              echo "### ✨ Changes"
              echo ""
              git log "$range" --no-merges --pretty=format:"- %s (%h)"
              echo ""
            } > RELEASE_NOTES.md

            python3 - "$version" "$release_date" <<'PY'
          import sys
          version, release_date = sys.argv[1], sys.argv[2]
          notes = open("RELEASE_NOTES.md").read().strip()
          changelog = open("CHANGELOG.md").read()
          entry = f"---\n\n## [v{version}] - {release_date}\n\n{notes}\n\n"
          if "\n---\n" in changelog:
              head, tail = changelog.split("\n---\n", 1)
              updated = head + "\n" + entry + "---" + tail.lstrip("\n")
          else:
              updated = changelog + "\n" + entry
          open("CHANGELOG.md", "w").write(updated)
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): update for v$version [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Run vet & tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Build cross-platform binaries and packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          targets=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm/7"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            os=$(echo "$target" | cut -d/ -f1)
            arch=$(echo "$target" | cut -d/ -f2)
            arm=$(echo "$target" | cut -s -d/ -f3)

            arch_name="$arch"
            if [ -n "$arm" ]; then
              arch_name="armv${arm}"
            fi

            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi

            staging="siyi_${version}_${os}_${arch_name}"
            mkdir -p "dist/$staging"

            echo "Building $staging..."
            GOARM="$arm" GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X 'github.com/hitraa/siyi-sdk-go.Version=${version}'" \
              -o "dist/$staging/siyi-cli${ext}" ./cmd/siyi-cli

            GOARM="$arm" GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X 'github.com/hitraa/siyi-sdk-go.Version=${version}'" \
              -o "dist/$staging/siyi-web${ext}" ./cmd/siyi-web

            cp README.md LICENSE "dist/$staging/" 2>/dev/null || true

            cd dist
            if [ "$os" = "windows" ]; then
              zip -rq "${staging}.zip" "$staging"
            else
              tar -czf "${staging}.tar.gz" "$staging"
            fi
            rm -rf "$staging"
            cd ..
          done

          cd dist
          sha256sum *.{tar.gz,zip} > checksums.txt
          cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            --title "$GITHUB_REF_NAME"
            --verify-tag
          )
          if [ -s RELEASE_NOTES.md ]; then
            args+=(--notes-file RELEASE_NOTES.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}"
