name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.22", "1.23", "1.24", "1.25", "1.26", "1.27", stable]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests
        run: go test -v ./...

      - name: Run race detector & coverage (Linux only)
        if: runner.os == 'Linux' && matrix.go-version == 'stable'
        run: go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build CLI & Web binaries
        run: |
          go build -v ./cmd/siyi-cli
          go build -v ./cmd/siyi-web

      - name: Build examples
        run: go build -v ./examples/...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
